<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-white text-black">
 <div id="header" class="bg-white border-b border-gray-100 font-sans sticky top-0 z-50"></div>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    <h1 class="text-3xl sm:text-4xl font-bold mb-8">
      Your Cart
    </h1>
    <div class="grid lg:grid-cols-3 gap-8 lg:gap-12">
      <section class="lg:col-span-2">
        <div id="cart-items">
        </div>
      </section>
      <aside class="lg:col-span-1">
        <div class="bg-[#F0EEED] rounded-[20px] p-6 sm:p-8 sticky top-6">
          <h2 class="text-xl sm:text-2xl font-bold mb-6">
            Order Summary
          </h2>
          <div class="flex items-center justify-between mb-4">
            <span class="text-black/60">
              Subtotal
            </span>
            <span   id="cart-subtotal"  class="font-bold"
            >
              $0.00
            </span>
          </div>
          <div class="flex items-center justify-between mb-4">
            <span class="text-black/60">
              Delivery Fee
            </span>
            <span class="font-bold" id="shipping">
              $15:00
            </span>
          </div>
          <div class="border-t border-black/10 my-5"></div>
          <div class="flex items-center justify-between mb-6">
            <span class="text-lg font-medium">
              Total
            </span>
            <span 
              id="cart-total"
              class="text-xl font-bold"
            >
              $0.00
            </span>
          </div>
          <button
            id="checkout-btn"
            class="w-full bg-black text-white py-4 rounded-full font-medium hover:bg-black/80 transition"
          >
            Go to Checkout
          </button>
        </div>
      </aside>
    </div>
    <div id="footer"></div>
  </main>
  <script src="cart.js"></script>
  <script src="header.js"></script>
  <script src="footer.js"></script>
  <script>
    renderCart();
    updateCartCount();
  </script>
</body>
</html>
