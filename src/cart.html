<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-white text-black">
  <header class="bg-white border-b border-gray-100 font-sans sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4 lg:gap-10">
      <div class="flex items-center gap-4">
        <div class="lg:hidden">
          <input type="checkbox" id="mobile-menu-checkbox" class="peer hidden" />
          <label for="mobile-menu-checkbox" class="text-black hover:text-gray-600 cursor-pointer block"
            aria-label="Open menu">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
          </label>
          <label for="mobile-menu-checkbox" class=" fixed inset-0 bg-black/40 z-40 hidden peer-checked:block"></label>
          <div class=" fixed top-0 left-0 z-50 w-[80%] max-w-[320px] h-screen bg-white shadow-2xl -translate-x-full peer-checked:translate-x-0 transition-transform duration-300 ease-in-out overflow-y-auto">
            <div class=" h-20 px-5 flex items-center justify-between border-b border-gray-100">
              <a href="index.html" class="text-2xl font-extrabold tracking-tighter text-black">
                SHOP.CO
              </a>
              <label for="mobile-menu-checkbox" class=" w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-100 cursor-pointer" aria-label="Close menu">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </label>
            </div>
            <nav class="px-5 py-6">
              <p class="text-xs uppercase tracking-widest text-gray-400 font-semibold mb-3">
                Menu
              </p>
              <div class="flex flex-col">
                <a href="#shop" class=" py-4 border-b border-gray-100 text-base font-semibold  text-black  hover:text-gray-500 transition">
                  Shop
                </a>
                <a href="#on-sale" class=" py-4 border-b border-gray-100 text-base font-semibold text-black hover:text-gray-500 transition">
                  On Sale</a>
                <a href="#new-arrivals" class="  py-4  border-b  border-gray-100  text-base  font-semibold  text-black  hover:text-gray-500  transition">New Arrivals
                </a>
                <a href="#brands" class="  py-4  border-b  border-gray-100  text-base  font-semibold  text-black  hover:text-gray-500  transition">
                  Brands
                </a>
              </div>
            </nav>
            <div class=" px-5 py-6 border-t border-gray-100 ">
              <p class="  text-xs  uppercase  tracking-widest  text-gray-400  font-semibold  mb-3">
                Account
              </p>
              <a href="cart.html" class=" flex items-center justify-between py-4 font-semibold text-black hover:text-gray-500 transition">
                <div class="flex items-center gap-3">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                    stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1-1.5 0Z" />
                  </svg>
                  <span>My Cart</span>
                </div>
                <span id="mobile-cart-count" class="  hidden  bg-black  text-white  text-xs  min-w-6  h-6  px-1  rounded-full  items-center  justify-center ">
                  0
                </span>
              </a>
              <a href="#" class=" flex items-center gap-3 py-4 font-semibold text-black hover:text-gray-500 transition">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                  stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                <span>My Account</span>
              </a>
            </div>
          </div>
        </div>
        <a href="index.html" class=" text-2xl sm:text-3xl font-extrabold tracking-tighter text-black">
          SHOP.CO
        </a>
      </div>
      <nav class=" hidden lg:flex items-center gap-6 text-base text-black whitespace-nowrap">
        <div class="relative group">
          <button class="  flex  items-center  gap-1  hover:text-gray-600  transition-colors  py-2">
            Shop
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
              stroke="currentColor" class=" w-3 h-3 pt-0.5 group-hover:rotate-180 transition-transform duration-200">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
            </svg>
          </button>
          <div class=" absolute left-0 top-full hidden group-hover:block bg-white shadow-lg rounded-xl border border-gray-100 p-4 min-w-40">
            <a href="#" class=" block px-2 py-1.5 text-sm hover:bg-gray-50 rounded-md ">
              Men's Apparel
            </a>
            <a href="#" class=" block px-2 py-1.5 text-sm hover:bg-gray-50 rounded-md">
              Women's Apparel
            </a>
            <a href="#" class=" block px-2 py-1.5 text-sm hover:bg-gray-50 rounded-md ">
              New Arrivals
            </a>
          </div>
        </div>
        <a href="#" class="hover:text-gray-600 transition-colors">
          On Sale
        </a>
        <a href="#" class="hover:text-gray-600 transition-colors">
          New Arrivals
        </a>
        <a href="#" class="hover:text-gray-600 transition-colors">
          Brands
        </a>
      </nav>
      <div class=" hidden md:flex flex-1 max-w-xl relative items-center">
        <span class=" absolute left-4 text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.602 10.602Z" />
          </svg>
        </span>
        <input type="text" placeholder="Search for products..." class="w-full bg-gray-100 text-sm text-black pl-12 pr-4 py-3 rounded-full outline-none focus:ring-1 focus:ring-gray-300 placeholder:text-gray-400 transition-all" />
      </div>
      <div class=" flex items-center gap-3 sm:gap-4 text-black">
        <button class=" md:hidden p-1 hover:text-gray-600" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.602 10.602Z" />
          </svg>
        </button>
        <a id="cartBtn" href="cart.html" class=" p-1 hover:text-gray-600 relative " aria-label="Shopping Cart">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1-1.5 0Z" />
          </svg>
          <span id="cart-count" class="  hidden  absolute  -top-2  -right-3  bg-black  text-white  text-xs  pl-1  w-5  h-5  rounded-full  items-center  justify-center">0</span>
        </a>
        <a href="#" class=" p-1 hover:text-gray-600" aria-label="Account">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
        </a>
      </div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    <h1 class="text-3xl sm:text-4xl font-bold mb-8">
      Your Cart
    </h1>
    <div class="grid lg:grid-cols-3 gap-8 lg:gap-12">
      <section class="lg:col-span-2">
        <div id="cart-items">
        </div>
      </section>
      <aside class="lg:col-span-1">
        <div class="bg-[#F0EEED] rounded-[20px] p-6 sm:p-8 sticky top-6">
          <h2 class="text-xl sm:text-2xl font-bold mb-6">
            Order Summary
          </h2>
          <div class="flex items-center justify-between mb-4">
            <span class="text-black/60">
              Subtotal
            </span>
            <span   id="cart-subtotal"  class="font-bold"
            >
              $0.00
            </span>
          </div>
          <div class="flex items-center justify-between mb-4">
            <span class="text-black/60">
              Delivery Fee
            </span>
            <span class="font-bold">
              Free
            </span>
          </div>
          <div class="border-t border-black/10 my-5"></div>
          <div class="flex items-center justify-between mb-6">
            <span class="text-lg font-medium">
              Total
            </span>
            <span 
              id="cart-total"
              class="text-xl font-bold"
            >
              $0.00
            </span>
          </div>
          <button
            id="checkout-btn"
            class="w-full bg-black text-white py-4 rounded-full font-medium hover:bg-black/80 transition"
          >
            Go to Checkout
          </button>
        </div>
      </aside>
    </div>
  </main>
  <script src="cart.js"></script>
  <script>
    renderCart();
    updateCartCount();
  </script>
</body>
</html>
